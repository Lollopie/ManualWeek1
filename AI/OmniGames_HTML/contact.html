<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniGames - Contact</title>
</head>
<body>
    <header>
        <h1>Contact OmniGames</h1>
        <p>Have a question? We would love to hear from you.</p>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Send Us a Message</h2>

            <form action="mailto:hello@omnigames.example" method="post" enctype="text/plain">
                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="subject">Subject:</label><br>
                    <input type="text" id="subject" name="subject" required>
                </p>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="8" cols="40" required></textarea>
                </p>

                <p>
                    <button type="submit">Send Message</button>
                </p>
            </form>
        </section>

        <section>
            <h2>Other Ways to Reach Us</h2>
            <p>Email: <a href="mailto:hello@omnigames.example">hello@omnigames.example</a></p>
            <p>Visit our <a href="about.html">About page</a> to learn more about OmniGames.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 OmniGames. All rights reserved.</p>
        <p><a href="index.html">Return to the home page</a></p>
    </footer>
</body>
</html>
