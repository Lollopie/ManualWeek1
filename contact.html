<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OmniGames - Contact</title>
</head>
<body>
    <header>
        <h1>
            OmniGames
        </h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About us</a> 
        </nav>
    </header>
    <main>
        <h2>
            Contact
        </h2>
        <form>
            <label for="fname">
                First Name
            </label>
            <input type="text" id="fname" name="fname">
            <label for="sname">
                Surname
            </label>
            <input type="text" id="sname" name="sname"><br>
            <label for="email">
                Email
            </label>
            <input type="email" id="email" name="email"><br>
            <label for="message">
                Message
            </label><br>
            <textarea id="message" name="message" rows="5" cols="20"></textarea><br>
            <button type="submit">
                Submit
            </button>
        </form>
    </main>
</body>
</html>
